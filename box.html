<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            height:200px;
            width:200px;
            background-color: beige;
            position:fixed;
            top:0px;
            left:0px;
            border-radius: 50%;
        }
        .box2{
             height:200px;
            width:200px;
            background-color: brown;
            position:fixed;
            top:0px;
            right:0px;
            border-radius: 50%;
        }
        .box3{
             height:200px;
            width:200px;
            background-color: aqua;
            position:fixed;
            bottom:0px;
            right:0px;
        }
        .box4{
             height:200px;
            width:200px;
            background-color: chartreuse;
            position:fixed;
            bottom:0px;
            left:0px;
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
</body>
</html>
